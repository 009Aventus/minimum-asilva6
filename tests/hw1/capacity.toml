image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1400000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\necho cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc\n"

[assert]
uart0_contains = "msh> bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\nmsh> msh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
